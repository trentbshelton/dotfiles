# archyoga — minimal Hyprland config
# Look: black bar, thin square borders, wide gaps, no blur/shadows/rounding.

# ---------- monitor ----------
monitor = , preferred, auto, 1

# ---------- programs ----------
$terminal = ghostty
$files    = thunar
$browser  = firefox
$menu     = fuzzel

# ---------- autostart ----------
exec-once = waybar
exec-once = mako
exec-once = hypridle
exec-once = systemctl --user start hyprpolkitagent
exec-once = ~/.config/hypr/wallpaper.sh
exec-once = ~/.config/hypr/battery-alert.sh
exec-once = wl-paste --type text --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store
exec-once = hyprsunset

# ---------- environment ----------
env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24

# ---------- look ----------
general {
    gaps_in = 10
    gaps_out = 28
    border_size = 1
    col.active_border = rgb(3b6fd1)
    col.inactive_border = rgb(3a3a3a)
    layout = dwindle
    resize_on_border = true
}

decoration {
    rounding = 0
    active_opacity = 1.0
    inactive_opacity = 1.0
    blur {
        enabled = false
    }
    shadow {
        enabled = false
    }
}

animations {
    enabled = true
    bezier = snappy, 0.2, 0.9, 0.1, 1.0
    animation = windows, 1, 3, snappy, popin 90%
    animation = windowsOut, 1, 3, snappy, popin 90%
    animation = fade, 1, 3, default
    animation = workspaces, 1, 3, snappy, slide
    animation = border, 0
}

dwindle {
    preserve_split = true
}

misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
    background_color = rgb(000000)
    force_default_wallpaper = 0
}

# ---------- input ----------
input {
    kb_layout = us
    follow_mouse = 1
    touchpad {
        natural_scroll = true
        tap-to-click = true
        disable_while_typing = true
    }
}

gesture = 3, horizontal, workspace

# ---------- keybinds ----------
# bindd = mods, key, description, dispatcher, args  (descriptions feed the Super+/ cheat sheet)
$mod = SUPER

# apps + menus
bindd = $mod, Return, Terminal, exec, $terminal
bindd = $mod, Space, App launcher, exec, $menu
bindd = $mod, D, App launcher, exec, $menu
bindd = $mod, E, File manager, exec, $files
bindd = $mod, B, Browser, exec, $browser
bindd = $mod, I, Settings menu, exec, ~/.config/hypr/settings.sh
bindd = $mod, C, Clipboard history, exec, cliphist list | fuzzel --dmenu --prompt "clipboard > " | cliphist decode | wl-copy
bindd = $mod, Escape, Power menu, exec, ~/.config/hypr/powermenu.sh
bindd = $mod, slash, Keybind cheat sheet, exec, ~/.config/hypr/keybinds.sh

# windows
bindd = $mod, Q, Close window, killactive
bindd = $mod, F, Fullscreen, fullscreen
bindd = $mod, V, Float / unfloat window, togglefloating
bindd = $mod, P, Pseudo-tile window, pseudo
bindd = $mod, J, Flip split direction, layoutmsg, togglesplit

# "minimize": hide window in a special workspace, Super+Shift+M to show/hide it
bindd = $mod, M, Minimize window, movetoworkspacesilent, special:minimized
bindd = $mod SHIFT, M, Show / hide minimized windows, togglespecialworkspace, minimized

# session
bindd = $mod, L, Lock screen, exec, hyprlock
bindd = $mod SHIFT, E, Log out (no confirm), exit
bindd = $mod SHIFT, R, Reload Hyprland config, exec, hyprctl reload

# focus (arrows + vim keys)
bindd = $mod, left, Focus left, movefocus, l
bindd = $mod, right, Focus right, movefocus, r
bindd = $mod, up, Focus up, movefocus, u
bindd = $mod, down, Focus down, movefocus, d
bindd = $mod, H, Focus left, movefocus, l
bindd = $mod, K, Focus up, movefocus, u

# move windows
bindd = $mod SHIFT, left, Move window left, movewindow, l
bindd = $mod SHIFT, right, Move window right, movewindow, r
bindd = $mod SHIFT, up, Move window up, movewindow, u
bindd = $mod SHIFT, down, Move window down, movewindow, d

# workspaces
bindd = $mod, 1, Go to workspace 1, workspace, 1
bindd = $mod, 2, Go to workspace 2, workspace, 2
bindd = $mod, 3, Go to workspace 3, workspace, 3
bindd = $mod, 4, Go to workspace 4, workspace, 4
bindd = $mod, 5, Go to workspace 5, workspace, 5
bindd = $mod, 6, Go to workspace 6, workspace, 6
bindd = $mod, 7, Go to workspace 7, workspace, 7
bindd = $mod, 8, Go to workspace 8, workspace, 8
bindd = $mod, 9, Go to workspace 9, workspace, 9
bindd = $mod SHIFT, 1, Move window to workspace 1, movetoworkspace, 1
bindd = $mod SHIFT, 2, Move window to workspace 2, movetoworkspace, 2
bindd = $mod SHIFT, 3, Move window to workspace 3, movetoworkspace, 3
bindd = $mod SHIFT, 4, Move window to workspace 4, movetoworkspace, 4
bindd = $mod SHIFT, 5, Move window to workspace 5, movetoworkspace, 5
bindd = $mod SHIFT, 6, Move window to workspace 6, movetoworkspace, 6
bindd = $mod SHIFT, 7, Move window to workspace 7, movetoworkspace, 7
bindd = $mod SHIFT, 8, Move window to workspace 8, movetoworkspace, 8
bindd = $mod SHIFT, 9, Move window to workspace 9, movetoworkspace, 9
bindd = $mod, mouse_down, Next workspace, workspace, e+1
bindd = $mod, mouse_up, Previous workspace, workspace, e-1

# mouse move/resize
bindmd = $mod, mouse:272, Drag to move window, movewindow
bindmd = $mod, mouse:273, Drag to resize window, resizewindow

# screenshots: region -> clipboard, full -> ~/Pictures/Screenshots
bindd = , Print, Screenshot region to clipboard, exec, grim -g "$(slurp)" - | wl-copy
bindd = SHIFT, Print, Screenshot full screen to file, exec, mkdir -p ~/Pictures/Screenshots && grim ~/Pictures/Screenshots/$(date +%F_%H-%M-%S).png

# laptop keys
bindeld = , XF86AudioRaiseVolume, Volume up, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
bindeld = , XF86AudioLowerVolume, Volume down, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindld  = , XF86AudioMute, Mute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindld  = , XF86AudioMicMute, Mute microphone, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindeld = , XF86MonBrightnessUp, Brightness up, exec, brightnessctl -e4 -n2 set 5%+
bindeld = , XF86MonBrightnessDown, Brightness down, exec, brightnessctl -e4 -n2 set 5%-
bindld  = , XF86AudioPlay, Play / pause, exec, playerctl play-pause
bindld  = , XF86AudioNext, Next track, exec, playerctl next
bindld  = , XF86AudioPrev, Previous track, exec, playerctl previous

# ---------- window rules ----------
windowrule = float on, match:class pavucontrol
windowrule = float on, match:title ^(Picture-in-Picture)$
