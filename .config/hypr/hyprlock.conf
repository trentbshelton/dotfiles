general {
    hide_cursor = true
}

background {
    color = rgb(000000)
}

label {
    text = $TIME
    font_family = JetBrainsMono Nerd Font
    font_size = 64
    color = rgb(ededed)
    position = 0, 120
    halign = center
    valign = center
}

label {
    text = cmd[update:60000] date +"%A · %d %B" | tr a-z A-Z
    font_family = JetBrainsMono Nerd Font
    font_size = 11
    color = rgb(8c8c8c)
    position = 0, 60
    halign = center
    valign = center
}

input-field {
    size = 280, 40
    outline_thickness = 1
    rounding = 0
    outer_color = rgb(ededed)
    inner_color = rgb(000000)
    font_color = rgb(ededed)
    check_color = rgb(8c8c8c)
    fail_color = rgb(ff4d4d)
    placeholder_text = <span foreground="##4a4a4a" letter_spacing="2000">PASSWORD</span>
    fade_on_empty = false
    dots_rounding = 0
    position = 0, 0
    halign = center
    valign = center
}
