general {
    hide_cursor = true
}

background {
    color = rgb(000000)
}

label {
    text = $TIME
    font_family = JetBrainsMono Nerd Font
    font_size = 64
    color = rgb(ffffff)
    position = 0, 120
    halign = center
    valign = center
}

input-field {
    size = 280, 40
    outline_thickness = 1
    rounding = 0
    outer_color = rgb(3a3a3a)
    inner_color = rgb(000000)
    font_color = rgb(d0d0d0)
    check_color = rgb(3b6fd1)
    fail_color = rgb(a33a3a)
    placeholder_text = password
    fade_on_empty = false
    dots_rounding = 0
    position = 0, 0
    halign = center
    valign = center
}
